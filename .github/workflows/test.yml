name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm install
      - run: npm run backend:check
      - run: npm run frontend:install
      - run: npm run frontend:build
      - run: npm run test:quick
